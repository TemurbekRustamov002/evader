name: Build APK
on:
  push:
    branches: [main]
    paths:
      - 'EvaderTest/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p EvaderTest assembleDebug -Pandroid.useAndroidX=true --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EvaderTest-apk
          path: EvaderTest/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
